<style>
.fallback-cv-pill {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 9999;
  background: rgba(5, 7, 10, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  color: #e5e5e5;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-family: 'Onest', sans-serif;
  letter-spacing: 0.04em;
  text-decoration: none;
  transition: all 0.2s ease;
  opacity: 0.75;
}
.fallback-cv-pill:hover {
  opacity: 1;
  border-color: #e0231c;
  color: #ffffff;
  transform: translateY(-1px);
}
</style>

<div id="root"></div>
<a class="fallback-cv-pill" href="/cv" title="View lightweight text CV">Minimal CV ↗</a>

<script type="module" src="{{ url_for('static', filename='kage-ui.js') }}"></script>
<script>
window.addEventListener('message', (event) => {
  const allowedLinks = new Set([
    'https://t.me/iamdylan2026',
    'https://x.com/dylan_ngmi',
    'https://github.com/DylanSoBad',
    'https://github.com/DylanSoBad/web3-portfolio-ai',
    'https://github.com/DylanSoBad/NoteBook',
    'https://github.com/DylanSoBad/Pact',
    'https://github.com/DylanSoBad/Wallet-Activity-Scanner',
    'https://github.com/DylanSoBad/shelby-cli'
  ]);
  if (event.origin === window.location.origin && event.data?.type === 'dylan-external-link' && allowedLinks.has(event.data.url)) {
    window.open(event.data.url, '_blank', 'noopener,noreferrer');
  }
});
</script>
